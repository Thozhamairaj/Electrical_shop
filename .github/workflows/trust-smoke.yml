name: Trust pipeline smoke

on:
  push:
    branches: [ main, feat/* ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install minimal Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install joblib requests xgboost scikit-learn

      - name: Run smoke test
        working-directory: server
        run: node scripts/smoke_predict_trust.js
